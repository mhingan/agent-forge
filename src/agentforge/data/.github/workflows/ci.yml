name: Validate AgentForge

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check embedded package data
        run: python scripts/sync_package_data.py --check
      - name: Validate skills and catalogs
        run: python -m agentforge validate --strict
      - name: Run tests
        run: python -m unittest discover -s tests -v
